<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0D0F">
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0D0F;
    --bg-panel: #15181C;
    --amber: #FF8A3D;
    --amber-dim: #B85F22;
    --steel: #4A9EBF;
    --text: #E8E6E0;
    --text-dim: #6B6F76;
    --border: #24282E;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--text);
    user-select: none;
  }

  body {
    display: flex;
    flex-direction: column;
    padding: 28px 36px;
    gap: 24px;
    opacity: 0;
  }

  /* ---------- Rotate prompt (shown when phone is in portrait) ---------- */
  .rotate-screen {
    position: fixed;
    inset: 0;
    z-index: 500;
    background: var(--bg);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
  }

  .rotate-screen.show { display: flex; }

  .rotate-icon {
    width: 56px;
    height: 56px;
    color: var(--amber);
    animation: rotate-hint 1.8s ease-in-out infinite;
  }

  @keyframes rotate-hint {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-90deg); }
  }

  .rotate-text {
    font-size: 13px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 500;
  }

  /* ---------- Splash / entrance screen ---------- */
  .splash {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.6s ease;
  }

  .splash.fade-out {
    opacity: 0;
    pointer-events: none;
  }

  .splash-mark {
    display: flex;
    align-items: center;
    gap: 18px;
    opacity: 0;
    transform: scale(0.92);
    animation: splash-in 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
  }

  @keyframes splash-in {
    to { opacity: 1; transform: scale(1); }
  }

  .splash-ring {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 2px solid var(--border);
    border-top-color: var(--amber);
    animation: splash-spin 1.1s linear infinite;
  }

  @keyframes splash-spin {
    to { transform: rotate(360deg); }
  }

  .splash-word {
    font-family: 'Oswald', sans-serif;
    font-size: 30px;
    font-weight: 500;
    letter-spacing: 6px;
    text-transform: uppercase;
  }

  .splash-word .accent { color: var(--amber); }

  .splash-line {
    position: absolute;
    bottom: 18%;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0;
    animation: splash-line-in 0.8s ease 0.6s forwards;
  }

  @keyframes splash-line-in {
    to { opacity: 1; }
  }

  /* ---------- Entrance choreography for main UI ---------- */
  body.ready { opacity: 1; }

  .enter {
    opacity: 0;
    transform: translateY(14px);
    animation: enter-up 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes enter-up {
    to { opacity: 1; transform: translateY(0); }
  }

  .strip .clock-block { animation-delay: 0.05s; }
  .strip .weather-block { animation-delay: 0.15s; }
  .tile-nav { animation-delay: 0.25s; }
  .tile-tube { animation-delay: 0.34s; }
  .tile-spot { animation-delay: 0.43s; }

  /* ---------- Dynamic Island (incoming call demo) ---------- */
  .island {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%) scaleX(0.001);
    transform-origin: center;
    width: 0;
    height: 36px;
    background: #000;
    border-radius: 30px;
    z-index: 900;
    display: flex;
    align-items: center;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,0.5);
    transition: width 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
                height 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
                transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .island.awake {
    width: 64px;
    transform: translateX(-50%) scaleX(1);
  }

  .island.expanded {
    width: 320px;
    height: 64px;
    transform: translateX(-50%) scaleX(1);
    border-radius: 26px;
  }

  .island-content {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 18px;
    width: 320px;
    opacity: 0;
    transition: opacity 0.25s ease 0.2s;
    white-space: nowrap;
  }

  .island.expanded .island-content { opacity: 1; }

  .island-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--amber), var(--amber-dim));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: #0B0D0F;
    flex-shrink: 0;
  }

  .island-text {
    display: flex;
    flex-direction: column;
    gap: 1px;
    flex: 1;
    min-width: 0;
  }

  .island-name {
    font-size: 13px;
    font-weight: 600;
    color: #F2F2F2;
  }

  .island-status {
    font-size: 11px;
    color: #9A9A9A;
  }

  .island-pulse {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #3FBF6F;
    flex-shrink: 0;
    animation: pulse-dot 1.2s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.75); }
  }

  /* ---------- Top instrument strip ---------- */
  .strip {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
    overflow: hidden;
  }

  .sweep {
    position: absolute;
    top: 0;
    left: -40%;
    width: 40%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,138,61,0.06), transparent);
    animation: sweep 7s linear infinite;
    pointer-events: none;
  }

  @keyframes sweep {
    0%   { left: -40%; }
    100% { left: 100%; }
  }

  .clock-block { display: flex; align-items: baseline; gap: 14px; }

  .clock {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 64px;
    letter-spacing: 1px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .clock .colon { color: var(--amber); }

  .date {
    font-size: 13px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 500;
  }

  .weather-block {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .weather-temp {
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 32px;
    color: var(--steel);
    line-height: 1;
  }

  .weather-meta {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .weather-cond {
    font-size: 13px;
    color: var(--text);
    font-weight: 500;
  }

  .weather-loc {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .weather-icon {
    width: 30px;
    height: 30px;
    color: var(--steel);
  }

  /* ---------- App tiles ---------- */
  .tiles {
    flex: 1;
    display: grid;
    grid-template-columns: 1.3fr 1fr 1fr;
    gap: 20px;
    min-height: 0;
  }

  .tile {
    position: relative;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 24px;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  }

  .tile:active {
    transform: scale(0.97);
    background: #1B1F25;
  }

  .tile-label {
    font-family: 'Oswald', sans-serif;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  .tile-sub {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .tile-icon {
    position: absolute;
    top: 22px;
    right: 22px;
    width: 30px;
    height: 30px;
    opacity: 0.85;
  }

  .tile-nav { border-top: 2px solid var(--amber); }
  .tile-nav .tile-icon, .tile-nav .tile-label { color: var(--amber); }

  .tile-tube { border-top: 2px solid #E0444B; }
  .tile-tube .tile-icon, .tile-tube .tile-label { color: #E0444B; }

  .tile-spot { border-top: 2px solid #3FBF6F; }
  .tile-spot .tile-icon, .tile-spot .tile-label { color: #3FBF6F; }

  svg { display: block; }
</style>
</head>
<body>

  <!-- Entrance splash -->
  <div class="splash" id="splash">
    <div class="splash-mark">
      <div class="splash-ring"></div>
      <div class="splash-word">DRIVE<span class="accent">.</span></div>
    </div>
    <div class="splash-line">Starting up</div>
  </div>

  <!-- Rotate-to-landscape fallback -->
  <div class="rotate-screen" id="rotateScreen">
    <svg class="rotate-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="6" y="3" width="12" height="18" rx="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="rotate-text">Rotate to landscape</div>
  </div>

  <!-- Dynamic Island (incoming call) -->
  <div class="island" id="island">
    <div class="island-content">
      <div class="island-avatar" id="islandAvatar">?</div>
      <div class="island-text">
        <div class="island-name" id="islandName">Caller</div>
        <div class="island-status">Incoming call</div>
      </div>
      <div class="island-pulse"></div>
    </div>
  </div>

  <div class="strip">
    <div class="sweep"></div>

    <div class="clock-block enter">
      <div class="clock" id="clock">--<span class="colon">:</span>--</div>
      <div class="date" id="date">---, --- --</div>
    </div>

    <div class="weather-block enter">
      <svg class="weather-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.4-1.7A4 4 0 0 0 5.5 16" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="weather-meta">
        <div class="weather-cond" id="weather-cond">Loading…</div>
        <div class="weather-loc" id="weather-loc">Negombo</div>
      </div>
      <div class="weather-temp" id="weather-temp">--°</div>
    </div>
  </div>

  <div class="tiles">

    <div class="tile tile-nav enter" onclick="launch('maps')">
      <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M9 20l-5.447-2.724A1 1 0 0 1 3 16.382V5.618a1 1 0 0 1 1.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0 0 21 18.382V7.618a1 1 0 0 0-.553-.894L15 4m0 13V4m0 0L9 7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="tile-label">Navigate</div>
      <div class="tile-sub">Maps</div>
    </div>

    <div class="tile tile-tube enter" onclick="launch('youtube')">
      <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="2" y="5" width="20" height="14" rx="3"/>
        <path d="M10 9.5l5 2.5-5 2.5z" fill="currentColor" stroke="none"/>
      </svg>
      <div class="tile-label">Watch</div>
      <div class="tile-sub">YouTube</div>
    </div>

    <div class="tile tile-spot enter" onclick="launch('spotify')">
      <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="9"/>
        <path d="M7 10c3-1 7-1 10 1M7.5 13c2.5-0.8 5.5-0.6 8 0.8M8 16c2-0.6 4.5-0.4 6.5 0.7" stroke-linecap="round"/>
      </svg>
      <div class="tile-label">Listen</div>
      <div class="tile-sub">Spotify</div>
    </div>

  </div>

  <script>
    // ---------- Entrance sequence ----------
    // Splash shows for up to ~1.4s of its own animation, then fades (total well under 5s),
    // and the main UI reveals with the staggered "enter" choreography defined in CSS.
    // Using a self-running function instead of window.addEventListener('load', ...) —
    // 'load' can fire before this script attaches on some mobile browsers / cached
    // local files, which silently skips the splash. This runs immediately and reliably.
    function runEntrance() {
      const splash = document.getElementById('splash');
      setTimeout(() => {
        document.body.classList.add('ready');
        splash.classList.add('fade-out');
        setTimeout(() => splash.remove(), 650);
      }, 1400);
    }
    runEntrance();

    // ---------- Orientation lock ----------
    function tryLockLandscape() {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    }

    function checkOrientation() {
      const rotateScreen = document.getElementById('rotateScreen');
      const isPortrait = window.innerHeight > window.innerWidth;
      rotateScreen.classList.toggle('show', isPortrait);
    }

    // Attempt the real lock (works once installed as a fullscreen/PWA app on most Android browsers)
    document.addEventListener('click', tryLockLandscape, { once: true });
    tryLockLandscape();
    window.addEventListener('resize', checkOrientation);
    window.addEventListener('orientationchange', checkOrientation);
    checkOrientation();

    // ---------- Clock ----------
    function updateClock() {
      const now = new Date();
      let h = now.getHours();
      const m = now.getMinutes().toString().padStart(2, '0');
      document.getElementById('clock').innerHTML = h.toString().padStart(2,'0') + '<span class="colon">:</span>' + m;
      const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      document.getElementById('date').textContent = days[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + now.getDate();
    }
    updateClock();
    setInterval(updateClock, 1000 * 10);

    // Placeholder weather — Phase 2 will wire this to a real weather API
    document.getElementById('weather-temp').textContent = '29°';
    document.getElementById('weather-cond').textContent = 'Partly cloudy';

    function launch(app) {
      // Placeholder — Phase 2 wires these to real deep links / app intents
      console.log('Launch requested:', app);
      document.body.style.opacity = '0.85';
      setTimeout(() => { document.body.style.opacity = '1'; }, 120);
    }

    // ---------- Dynamic Island incoming-call demo ----------
    // Real call detection needs native app permissions (Phase 3). This shows the
    // visual behavior: wakes -> expands with caller info -> stays -> shrinks away.
    // It is purely a notification surface — it never takes over the screen or
    // interrupts/pauses whatever the dashboard or Bluetooth audio is doing.
    function simulateIncomingCall(name) {
      const island = document.getElementById('island');
      document.getElementById('islandName').textContent = name;
      document.getElementById('islandAvatar').textContent = name.charAt(0).toUpperCase();

      island.classList.add('awake');
      setTimeout(() => island.classList.add('expanded'), 260);

      setTimeout(() => {
        island.classList.remove('expanded');
        setTimeout(() => island.classList.remove('awake'), 450);
      }, 5000);
    }

    // Demo trigger: tap the clock to preview an incoming call
    document.querySelector('.clock-block').addEventListener('click', (e) => {
      e.stopPropagation();
      simulateIncomingCall('Mom');
    });
  </script>

</body>
</html>
