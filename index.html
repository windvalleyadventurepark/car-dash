<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0D0F">
<title>Drive.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0B0D0F;
    --bg-panel:  #15181C;
    --amber:     #FF8A3D;
    --amber-dim: #B85F22;
    --steel:     #4A9EBF;
    --text:      #E8E6E0;
    --text-dim:  #6B6F76;
    --border:    #24282E;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body {
    width:100%; height:100%;
    overflow:hidden;
    background:var(--bg);
    font-family:'Inter', sans-serif;
    color:var(--text);
    user-select:none;
  }

  /* ===================== SPLASH ===================== */
  .splash {
    position:fixed; inset:0; z-index:1000;
    background:var(--bg);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:0;
    transition: opacity 1s ease;
  }
  .splash.fade-out { opacity:0; pointer-events:none; }

  /* Horizontal scan line that sweeps down the whole screen */
  .splash-scan {
    position:absolute; top:0; left:0; right:0;
    height:2px;
    background:linear-gradient(90deg, transparent 0%, var(--amber) 40%, rgba(255,138,61,0.4) 60%, transparent 100%);
    box-shadow: 0 0 18px 4px rgba(255,138,61,0.35);
    animation: scan-down 1.6s cubic-bezier(0.4, 0, 0.6, 1) 0.1s forwards;
    opacity:0;
  }
  @keyframes scan-down {
    0%   { top:0%;   opacity:1; }
    85%  { opacity:1; }
    100% { top:100%; opacity:0; }
  }

  /* Corner bracket decorations */
  .splash-corners {
    position:absolute; inset:28px;
    opacity:0;
    animation: fade-in-slow 0.6s ease 0.8s forwards;
  }
  @keyframes fade-in-slow { to { opacity:1; } }

  .splash-corners::before,
  .splash-corners::after,
  .splash-corner-br,
  .splash-corner-bl {
    content:'';
    position:absolute;
    width:32px; height:32px;
  }
  .splash-corners::before {
    top:0; left:0;
    border-top:1px solid var(--amber);
    border-left:1px solid var(--amber);
    opacity:0.5;
  }
  .splash-corners::after {
    top:0; right:0;
    border-top:1px solid var(--amber);
    border-right:1px solid var(--amber);
    opacity:0.5;
  }
  .splash-corner-br {
    position:absolute;
    bottom:28px; right:28px;
    width:32px; height:32px;
    border-bottom:1px solid var(--amber);
    border-right:1px solid var(--amber);
    opacity:0.5;
  }
  .splash-corner-bl {
    position:absolute;
    bottom:28px; left:28px;
    width:32px; height:32px;
    border-bottom:1px solid var(--amber);
    border-left:1px solid var(--amber);
    opacity:0.5;
  }

  /* Center logo block */
  .splash-center {
    display:flex; flex-direction:column; align-items:center; gap:20px;
    opacity:0; transform:translateY(10px);
    animation: splash-rise 1s cubic-bezier(0.16,1,0.3,1) 0.7s forwards;
  }
  @keyframes splash-rise {
    to { opacity:1; transform:translateY(0); }
  }

  .splash-ring-wrap {
    position:relative; width:72px; height:72px;
  }
  .splash-ring-outer {
    position:absolute; inset:0;
    border-radius:50%;
    border:1px solid var(--border);
    border-top-color:var(--amber);
    border-right-color:rgba(255,138,61,0.4);
    animation:spin 1.8s linear infinite;
  }
  .splash-ring-inner {
    position:absolute; inset:10px;
    border-radius:50%;
    border:1px solid transparent;
    border-bottom-color:var(--amber-dim);
    animation:spin 1.2s linear infinite reverse;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  .splash-dot {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  .splash-dot::after {
    content:'';
    width:8px; height:8px;
    border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 12px 4px rgba(255,138,61,0.5);
    animation:pulse-amber 1.8s ease-in-out infinite;
  }
  @keyframes pulse-amber {
    0%,100% { opacity:1; transform:scale(1); }
    50%      { opacity:0.5; transform:scale(0.6); }
  }

  .splash-wordmark {
    font-family:'Oswald', sans-serif;
    font-size:52px; font-weight:700;
    letter-spacing:14px;
    text-transform:uppercase;
  }
  .splash-wordmark .acc { color:var(--amber); }

  .splash-tagline {
    font-size:11px; font-weight:400;
    color:var(--text-dim);
    letter-spacing:4px;
    text-transform:uppercase;
    opacity:0;
    animation:fade-in-slow 0.8s ease 1.4s forwards;
  }

  /* Progress bar at bottom */
  .splash-progress-track {
    position:absolute; bottom:52px; left:50%; transform:translateX(-50%);
    width:180px; height:1px;
    background:var(--border);
    overflow:hidden;
    opacity:0;
    animation:fade-in-slow 0.4s ease 0.9s forwards;
  }
  .splash-progress-fill {
    height:100%;
    background:linear-gradient(90deg, var(--amber-dim), var(--amber));
    box-shadow:0 0 8px 2px rgba(255,138,61,0.4);
    animation:progress-fill 1.8s cubic-bezier(0.4,0,0.2,1) 0.9s forwards;
    width:0;
  }
  @keyframes progress-fill { to { width:100%; } }

  .splash-status {
    position:absolute; bottom:32px; left:50%; transform:translateX(-50%);
    font-size:10px; color:var(--text-dim);
    letter-spacing:2.5px; text-transform:uppercase; white-space:nowrap;
    opacity:0;
    animation:fade-in-slow 0.6s ease 1s forwards;
  }

  /* ===================== ROTATE SCREEN ===================== */
  .rotate-screen {
    position:fixed; inset:0; z-index:500;
    background:var(--bg);
    display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:22px;
  }
  .rotate-screen.show { display:flex; }
  .rotate-icon {
    width:52px; height:52px; color:var(--amber);
    animation:rotate-hint 2s ease-in-out infinite;
  }
  @keyframes rotate-hint {
    0%,100% { transform:rotate(0deg); }
    50%      { transform:rotate(-90deg); }
  }
  .rotate-text {
    font-size:12px; color:var(--text-dim);
    text-transform:uppercase; letter-spacing:2.5px; font-weight:500;
  }

  /* ===================== DYNAMIC ISLAND ===================== */
  .island {
    position:fixed; top:14px; left:50%;
    transform:translateX(-50%) scaleX(0.001);
    transform-origin:center;
    width:0; height:36px;
    background:#000; border-radius:30px;
    z-index:900;
    display:flex; align-items:center;
    overflow:hidden;
    box-shadow:0 8px 32px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,138,61,0);
    transition:
      width  0.6s cubic-bezier(0.34,1.56,0.64,1),
      height 0.6s cubic-bezier(0.34,1.56,0.64,1),
      transform 0.6s cubic-bezier(0.34,1.56,0.64,1),
      box-shadow 0.6s ease,
      border-radius 0.6s ease;
  }
  .island.awake {
    width:72px;
    transform:translateX(-50%) scaleX(1);
    box-shadow:0 8px 32px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,138,61,0.15);
  }
  .island.expanded {
    width:340px; height:72px;
    transform:translateX(-50%) scaleX(1);
    border-radius:28px;
    box-shadow:0 12px 40px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,138,61,0.25);
  }
  .island-content {
    display:flex; align-items:center; gap:12px;
    padding:0 18px; width:340px;
    opacity:0;
    transition:opacity 0.3s ease 0.25s;
    white-space:nowrap;
  }
  .island.expanded .island-content { opacity:1; }
  .island-avatar {
    width:38px; height:38px; border-radius:50%;
    background:linear-gradient(135deg, var(--amber), var(--amber-dim));
    display:flex; align-items:center; justify-content:center;
    font-family:'Oswald', sans-serif; font-size:16px; font-weight:600;
    color:#0B0D0F; flex-shrink:0;
  }
  .island-text { display:flex; flex-direction:column; gap:2px; flex:1; min-width:0; }
  .island-name  { font-size:13px; font-weight:600; color:#F2F2F2; }
  .island-status { font-size:11px; color:#9A9A9A; }
  .island-pulse {
    width:8px; height:8px; border-radius:50%;
    background:#3FBF6F; flex-shrink:0;
    animation:pulse-dot 1.2s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%,100% { opacity:1; transform:scale(1); }
    50%      { opacity:0.4; transform:scale(0.75); }
  }

  /* ===================== MAIN UI ===================== */
  body {
    display:flex; flex-direction:column;
    padding:24px 32px; gap:20px;
    opacity:0; transition:opacity 0.4s ease;
  }
  body.ready { opacity:1; }

  /* Top strip */
  .strip {
    position:relative;
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom:18px;
    border-bottom:1px solid var(--border);
    overflow:hidden;
  }
  .sweep {
    position:absolute; top:0; left:-40%; width:40%; height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,138,61,0.05), transparent);
    animation:sweep 8s linear infinite;
    pointer-events:none;
  }
  @keyframes sweep { 0%{left:-40%} 100%{left:100%} }

  .clock-block { display:flex; align-items:baseline; gap:14px; }
  .clock {
    font-family:'Oswald', sans-serif; font-weight:600;
    font-size:62px; letter-spacing:1px; line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .clock .colon { color:var(--amber); }
  .date { font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1.5px; font-weight:500; }

  .weather-block { display:flex; align-items:center; gap:14px; }
  .weather-temp {
    font-family:'Oswald', sans-serif; font-weight:500;
    font-size:30px; color:var(--steel); line-height:1;
  }
  .weather-meta { display:flex; flex-direction:column; gap:3px; }
  .weather-cond { font-size:13px; color:var(--text); font-weight:500; }
  .weather-loc  { font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; }
  .weather-icon { width:28px; height:28px; color:var(--steel); }

  /* Tiles */
  .tiles {
    flex:1; display:grid;
    grid-template-columns:1.3fr 1fr 1fr;
    gap:18px; min-height:0;
  }

  .tile {
    position:relative;
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:14px;
    display:flex; flex-direction:column; justify-content:flex-end;
    padding:22px; cursor:pointer; overflow:hidden;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .tile:active { transform:scale(0.97); background:#1B1F25; }

  /* Big branded logo area top-right of each tile */
  .tile-logo {
    position:absolute;
    top:18px; right:18px;
    width:52px; height:52px;
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }

  /* Maps logo — Google Maps pin shape in brand colors */
  .tile-nav .tile-logo { background:#E8F0FE; }
  .logo-maps { width:32px; height:32px; }

  /* YouTube logo */
  .tile-tube .tile-logo { background:#FF0000; border-radius:10px; }
  .logo-yt { width:28px; height:20px; }

  /* Spotify logo */
  .tile-spot .tile-logo { background:#1DB954; border-radius:50%; }
  .logo-spot { width:30px; height:30px; }

  .tile-label {
    font-family:'Oswald', sans-serif;
    font-size:22px; font-weight:500; letter-spacing:0.5px;
    margin-top:64px;
  }
  .tile-sub {
    font-size:11px; color:var(--text-dim);
    margin-top:4px; text-transform:uppercase; letter-spacing:1.2px;
  }

  .tile-nav  { border-top:2px solid var(--amber); }
  .tile-nav  .tile-label { color:var(--amber); }
  .tile-tube { border-top:2px solid #FF0000; }
  .tile-tube .tile-label { color:#FF4444; }
  .tile-spot { border-top:2px solid #1DB954; }
  .tile-spot .tile-label { color:#1DB954; }

  /* Entrance stagger */
  .enter {
    opacity:0; transform:translateY(22px);
    animation:enter-up 0.9s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  @keyframes enter-up {
    0%   { opacity:0; transform:translateY(22px); }
    60%  { opacity:1; }
    100% { opacity:1; transform:translateY(0); }
  }
  .strip .clock-block   { animation-delay:0.10s; }
  .strip .weather-block { animation-delay:0.25s; }
  .tile-nav  { animation-delay:0.40s; }
  .tile-tube { animation-delay:0.55s; }
  .tile-spot { animation-delay:0.70s; }

  svg { display:block; }
</style>
</head>
<body>

  <!-- ===== SPLASH ===== -->
  <div class="splash" id="splash">
    <div class="splash-scan"></div>

    <div class="splash-corners">
      <div class="splash-corner-br"></div>
      <div class="splash-corner-bl"></div>
    </div>

    <div class="splash-center">
      <div class="splash-ring-wrap">
        <div class="splash-ring-outer"></div>
        <div class="splash-ring-inner"></div>
        <div class="splash-dot"></div>
      </div>
      <div class="splash-wordmark">DRIVE<span class="acc">.</span></div>
      <div class="splash-tagline">All Version CarPlay</div>
    </div>

    <div class="splash-progress-track">
      <div class="splash-progress-fill"></div>
    </div>
    <div class="splash-status">Initialising your drive</div>
  </div>

  <!-- ===== ROTATE PROMPT ===== -->
  <div class="rotate-screen" id="rotateScreen">
    <svg class="rotate-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="6" y="3" width="12" height="18" rx="2"/>
      <path d="M4 17l-2 2 2 2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M20 7l2-2-2-2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="rotate-text">Rotate to landscape</div>
  </div>

  <!-- ===== DYNAMIC ISLAND ===== -->
  <div class="island" id="island">
    <div class="island-content">
      <div class="island-avatar" id="islandAvatar">?</div>
      <div class="island-text">
        <div class="island-name" id="islandName">Caller</div>
        <div class="island-status">Incoming call</div>
      </div>
      <div class="island-pulse"></div>
    </div>
  </div>

  <!-- ===== MAIN UI ===== -->
  <div class="strip">
    <div class="sweep"></div>
    <div class="clock-block enter">
      <div class="clock" id="clock">--<span class="colon">:</span>--</div>
      <div class="date" id="date">---, --- --</div>
    </div>
    <div class="weather-block enter">
      <svg class="weather-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.4-1.7A4 4 0 0 0 5.5 16" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="weather-meta">
        <div class="weather-cond" id="weather-cond">Partly cloudy</div>
        <div class="weather-loc">Negombo</div>
      </div>
      <div class="weather-temp" id="weather-temp">29°</div>
    </div>
  </div>

  <div class="tiles">

    <!-- MAPS -->
    <div class="tile tile-nav enter" onclick="launch('maps')">
      <div class="tile-logo">
        <!-- Google Maps pin — real brand shape -->
        <svg class="logo-maps" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="17" r="10" fill="#4285F4"/>
          <circle cx="20" cy="17" r="10" fill="url(#maps-grad)"/>
          <circle cx="20" cy="17" r="4" fill="white"/>
          <path d="M20 27 C20 27 13 20 13 15 C13 11.13 16.13 8 20 8 C23.87 8 27 11.13 27 15 C27 20 20 27 20 27Z" fill="#34A853" opacity="0.3"/>
          <path d="M20 28 L14 20 Q10 15 13.5 11 Q16 7 20 7 Q24 7 26.5 11 Q30 15 26 20 Z" fill="#EA4335" opacity="0.0"/>
          <defs>
            <radialGradient id="maps-grad" cx="35%" cy="35%">
              <stop offset="0%" stop-color="#5B9BF8"/>
              <stop offset="100%" stop-color="#1A73E8"/>
            </radialGradient>
          </defs>
          <!-- Simplified real Maps pin -->
          <ellipse cx="20" cy="30" rx="4" ry="2" fill="#34A853" opacity="0.4"/>
          <path d="M20 10 C15.6 10 12 13.6 12 18 C12 23.4 20 31 20 31 C20 31 28 23.4 28 18 C28 13.6 24.4 10 20 10Z" fill="#EA4335"/>
          <path d="M20 10 C20 10 28 13.6 28 18 C28 23.4 20 31 20 31" fill="#C5221F"/>
          <circle cx="20" cy="18" r="4.5" fill="white"/>
        </svg>
      </div>
      <div class="tile-label">Navigate</div>
      <div class="tile-sub">Google Maps</div>
    </div>

    <!-- YOUTUBE -->
    <div class="tile tile-tube enter" onclick="launch('youtube')">
      <div class="tile-logo">
        <svg class="logo-yt" viewBox="0 0 90 63" fill="none">
          <!-- White play button on red — actual YouTube logo proportions -->
          <rect width="90" height="63" rx="14" fill="#FF0000"/>
          <path d="M37 19 L37 44 L62 31.5 Z" fill="white"/>
        </svg>
      </div>
      <div class="tile-label">Watch</div>
      <div class="tile-sub">YouTube</div>
    </div>

    <!-- SPOTIFY -->
    <div class="tile tile-spot enter" onclick="launch('spotify')">
      <div class="tile-logo">
        <!-- Spotify icon — green circle + 3 sound waves -->
        <svg class="logo-spot" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="20" fill="#1DB954"/>
          <path d="M10 16 Q20 12 30 16" stroke="white" stroke-width="3" stroke-linecap="round" fill="none"/>
          <path d="M11.5 21 Q20 17.5 28.5 21" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          <path d="M13 26 Q20 23 27 26" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <div class="tile-label">Listen</div>
      <div class="tile-sub">Spotify</div>
    </div>

  </div>

  <script>
    // ===== SPLASH SEQUENCE =====
    function runEntrance() {
      const splash = document.getElementById('splash');
      // Hold for 3s (scan + logo + progress all visible), then fade out
      setTimeout(() => {
        document.body.classList.add('ready');
        splash.classList.add('fade-out');
        setTimeout(() => splash.remove(), 1000);
      }, 3000);
    }
    runEntrance();

    // ===== ORIENTATION =====
    function tryLockLandscape() {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    }
    function checkOrientation() {
      const r = document.getElementById('rotateScreen');
      r.classList.toggle('show', window.innerHeight > window.innerWidth);
    }
    document.addEventListener('click', tryLockLandscape, { once:true });
    tryLockLandscape();
    window.addEventListener('resize', checkOrientation);
    window.addEventListener('orientationchange', checkOrientation);
    checkOrientation();

    // ===== CLOCK =====
    function updateClock() {
      const now = new Date();
      const h = now.getHours().toString().padStart(2,'0');
      const m = now.getMinutes().toString().padStart(2,'0');
      document.getElementById('clock').innerHTML = h + '<span class="colon">:</span>' + m;
      const days   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      document.getElementById('date').textContent =
        days[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + now.getDate();
    }
    updateClock();
    setInterval(updateClock, 10000);

    // ===== TILE LAUNCH (Phase 2 will wire real deep links) =====
    function launch(app) {
      const urls = {
        maps:    'https://maps.google.com',
        youtube: 'https://m.youtube.com',
        spotify: 'https://open.spotify.com'
      };
      if (urls[app]) window.open(urls[app], '_blank');
    }

    // ===== DYNAMIC ISLAND =====
    function simulateIncomingCall(name) {
      const island = document.getElementById('island');
      document.getElementById('islandName').textContent = name;
      document.getElementById('islandAvatar').textContent = name.charAt(0).toUpperCase();
      island.classList.add('awake');
      setTimeout(() => island.classList.add('expanded'), 300);
      setTimeout(() => {
        island.classList.remove('expanded');
        setTimeout(() => island.classList.remove('awake'), 600);
      }, 7000);
    }

    // Tap the clock to demo the incoming call
    document.querySelector('.clock-block').addEventListener('click', e => {
      e.stopPropagation();
      simulateIncomingCall('Mom');
    });
  </script>

</body>
</html>
